[package]
name = "dinfer-glm53"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GLM-5.3 模型实现：MLA + DSA 稀疏索引器 + FP8 MoE + MTP + HF tokenizer/jinja"

[features]
default = []
no-nvcc = ["dinfer-layers/no-nvcc"]
# tiny 模型对拍（读 scripts/verify/gen_tiny_glm.py 的产物）
ref-tests = ["dep:npyz"]

[dependencies]
dinfer-core.workspace = true
dinfer-layers.workspace = true
dinfer-kernels.workspace = true
dinfer-server.workspace = true
dinfer-text.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
minijinja.workspace = true
npyz = { version = "=0.8.3", optional = true }
