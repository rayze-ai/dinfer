[workspace]
resolver = "2"
members = [
    # 公用基础设施
    "crates/core",
    "crates/kernels",
    "crates/layers",
    "crates/text",
    "crates/server",
    "crates/guided",
    # 模型 crate（每个模型一个；构建 = core + server + 一个模型）
    "models/qwen3",
    "models/qwen35",
    "models/glm53",
    "models/kimik3",
    "models/kaon3",
    # 可执行
    "bins/dinfer",
    "bins/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://example.invalid/dinfer"

[workspace.dependencies]
# 本地 crate
dinfer-core = { path = "crates/core" }
dinfer-kernels = { path = "crates/kernels" }
dinfer-layers = { path = "crates/layers" }
dinfer-server = { path = "crates/server" }
dinfer-kimik3 = { path = "models/kimik3" }
dinfer-glm53 = { path = "models/glm53" }
dinfer-qwen3 = { path = "models/qwen3" }
dinfer-qwen35 = { path = "models/qwen35" }
dinfer-text = { path = "crates/text" }
dinfer-guided = { path = "crates/guided" }

# 第三方：固定版本（见 docs/design.md §3.1）
anyhow = "=1.0.98"
libc = "=0.2.190"
thiserror = "=2.0.12"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }  # chat 模板 tojson 要保持 key 插入序（Python dict 语义）
clap = { version = "=4.5.40", features = ["derive"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
tokio = { version = "=1.45.1", features = ["full"] }
axum = { version = "=0.8.4", features = ["json", "macros"] }
crossbeam-channel = "=0.5.15"
parking_lot = "=0.12.4"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
half = { version = "=2.6.0", features = ["bytemuck"] }
bytemuck = { version = "=1.23.1", features = ["derive"] }
memmap2 = "=0.9.5"
safetensors = "=0.5.3"
tokenizers = { version = "=0.21.2", default-features = false, features = ["onig"] }
minijinja = { version = "=2.10.2", features = ["json", "loader", "loop_controls", "builtins", "preserve_order"] }
fancy-regex = "=0.14.0"   # K3 tiktoken pat_str（类交集 && + 负向前瞻），与 tiktoken 自身同实现
base64 = "=0.22.1"        # tiktoken.model ranks 行 base64
cudarc = { version = "=0.18.2", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "cublaslt", "f16", "nccl", "dynamic-linking", "cuda-version-from-build-system"] }
criterion = "=0.6.0"
tokio-stream = "=0.1.17"
futures-core = "=0.3.34"
# 受限解码（docs/loops/guided-decoding.md）：vLLM guidance 后端同源
llguidance = "=1.9.1"
toktrie_hf_tokenizers = "=1.9.1"
jsonschema = { version = "=0.30.0", default-features = false }
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "stream"] }
cc = "=1.2.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.bench]
inherits = "release"
